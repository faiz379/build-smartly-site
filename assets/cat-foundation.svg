    <path d="M60 120 L300 180"/><path d="M60 140 L300 200"/><path d="M60 160 L300 220"/>
  </g>
  <g stroke="#B08A5E" stroke-width="3"><path d="M110 128v16M160 140v16M210 152v16M260 164v16"/></g>
  <rect x="150" y="140" width="18" height="60" rx="4" fill="#E3A63A" transform="rotate(14 159 170)"/>
