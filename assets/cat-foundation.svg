<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Foundation materials: cement bags, rebar and gravel">
  <circle cx="200" cy="200" r="200" fill="#F6F7F4"/>
  <ellipse cx="200" cy="320" rx="150" ry="22" fill="#E3DED3"/>
  <!-- gravel pile -->
  <path d="M60 310 Q110 230 170 310z" fill="#9CA39A"/>
  <path d="M90 310 Q130 250 180 310z" fill="#B4BAB1"/>
  <circle cx="110" cy="290" r="9" fill="#8A9188"/><circle cx="140" cy="300" r="7" fill="#C7CCC4"/><circle cx="125" cy="275" r="6" fill="#C7CCC4"/>
  <!-- cement bags -->
  <g>
    <rect x="170" y="250" width="130" height="62" rx="10" fill="#D9D3C7"/>
    <rect x="170" y="250" width="130" height="16" rx="8" fill="#B9AE9C"/>
    <text x="235" y="297" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="800" fill="#1E6B4E">OPC 42.5</text>
    <rect x="190" y="196" width="130" height="62" rx="10" fill="#E8E2D6"/>
    <rect x="190" y="196" width="130" height="16" rx="8" fill="#C9BFAE"/>
    <text x="255" y="243" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="800" fill="#1E6B4E">50 kg</text>
  </g>
