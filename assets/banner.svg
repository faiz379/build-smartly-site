<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="Build Smartly banner: construction site at sunrise in Addis Ababa">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D2C21"/><stop offset="1" stop-color="#1E6B4E"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C879"/><stop offset="1" stop-color="#E3A63A"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B5A47"/><stop offset="1" stop-color="#14241E"/></linearGradient>
    <clipPath id="frame"><rect width="1600" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="520" fill="url(#sky)"/>
    <!-- sun and hills -->
    <circle cx="1240" cy="190" r="110" fill="url(#sun)" opacity=".95"/>
    <path d="M900 400 Q1050 300 1200 380 T1600 360 V520 H900z" fill="#1A4A38"/>
    <path d="M700 420 Q900 340 1100 410 T1600 400 V520 H700z" fill="#163E2F"/>
    <rect y="420" width="1600" height="100" fill="url(#ground)"/>
    <!-- tower crane -->
    <g stroke="#E3A63A" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M1010 420 V120"/>
      <path d="M1010 120 H1330"/>
      <path d="M1010 120 H920"/>
      <path d="M1010 150 L1080 120 M1010 180 L1140 120 M1010 210 L1200 120"/>
    </g>
    <path d="M1250 120 V210" stroke="#F6F7F4" stroke-width="4"/>
    <rect x="1232" y="210" width="36" height="22" rx="3" fill="#F6F7F4"/>
    <rect x="920" y="108" width="40" height="24" rx="3" fill="#C98C22"/>
    <!-- building under construction -->
    <g>
      <rect x="1060" y="230" width="220" height="190" fill="#A8ADA6"/>
      <g fill="#14241E" opacity=".55">
        <rect x="1080" y="250" width="40" height="40"/><rect x="1150" y="250" width="40" height="40"/><rect x="1220" y="250" width="40" height="40"/>
        <rect x="1080" y="310" width="40" height="40"/><rect x="1150" y="310" width="40" height="40"/><rect x="1220" y="310" width="40" height="40"/>
        <rect x="1080" y="370" width="40" height="50"/><rect x="1150" y="370" width="40" height="50"/><rect x="1220" y="370" width="40" height="50"/>
      </g>
      <g stroke="#E3A63A" stroke-width="6"><path d="M1060 230 H1280 M1060 290 H1280 M1060 350 H1280"/></g>
      <!-- scaffolding -->
      <g stroke="#F6F7F4" stroke-width="3" opacity=".8"><path d="M1290 230 V420 M1320 230 V420 M1290 260 H1320 M1290 300 H1320 M1290 340 H1320 M1290 380 H1320"/></g>
    </g>
    <!-- finished building silhouette -->
    <rect x="1370" y="300" width="150" height="120" fill="#12402F"/>
    <g fill="#E3A63A" opacity=".8"><rect x="1385" y="315" width="18" height="18"/><rect x="1420" y="315" width="18" height="18"/><rect x="1455" y="315" width="18" height="18"/><rect x="1385" y="350" width="18" height="18"/><rect x="1455" y="350" width="18" height="18"/><rect x="1420" y="385" width="18" height="18"/></g>
    <!-- materials in the foreground -->
    <g>
      <rect x="860" y="372" width="90" height="48" rx="6" fill="#D9D3C7"/><rect x="860" y="372" width="90" height="12" rx="6" fill="#B9AE9C"/>
      <rect x="880" y="340" width="90" height="48" rx="6" fill="#E8E2D6"/><rect x="880" y="340" width="90" height="12" rx="6" fill="#C9BFAE"/>
      <path d="M760 420 Q800 350 850 420z" fill="#9CA39A"/><path d="M700 420 Q760 360 820 420z" fill="#B4BAB1"/>
      <g stroke="#7A5C3A" stroke-width="7" stroke-linecap="round"><path d="M560 400 H700 M560 410 H690 M565 420 H700"/></g>
      <g fill="#B9B4A8"><rect x="980" y="392" width="60" height="28"/><rect x="990" y="364" width="60" height="28"/></g>
    </g>
    <!-- logo mark -->
    <g transform="translate(96 96)">
      <rect width="96" height="96" rx="22" fill="#F6F7F4"/>
      <rect x="18" y="62" width="34" height="14" rx="3" fill="#1E6B4E"/><rect x="30" y="44" width="34" height="14" rx="3" fill="#1E6B4E"/><rect x="42" y="26" width="34" height="14" rx="3" fill="#E3A63A"/>
      <path d="M62 17 l7 -7 l7 7" fill="none" stroke="#E3A63A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="216" y="156" font-family="Sora, Manrope, Arial, sans-serif" font-size="54" font-weight="800" fill="#F6F7F4" letter-spacing="-1">Build <tspan fill="#E3A63A">Smartly</tspan></text>
    <text x="218" y="190" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#B9CBC2" letter-spacing="4">CONSTRUCTION MATERIALS PROCUREMENT · ETHIOPIA</text>
    <text x="96" y="290" font-family="Sora, Manrope, Arial, sans-serif" font-size="44" font-weight="700" fill="#F6F7F4">Send your BOQ.</text>
    <text x="96" y="344" font-family="Sora, Manrope, Arial, sans-serif" font-size="44" font-weight="700" fill="#F6F7F4">Get real supplier quotes.</text>
    <text x="96" y="398" font-family="Sora, Manrope, Arial, sans-serif" font-size="44" font-weight="700" fill="#E3A63A">Choose line by line.</text>
    <text x="98" y="452" font-family="Noto Sans Ethiopic, Nyala, Abyssinica SIL, Arial, sans-serif" font-size="22" font-weight="600" fill="#B9CBC2">በብልሃት ይገንቡ · Ijaarsa ogummaan</text>
  </g>
</svg>
